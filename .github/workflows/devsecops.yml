name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # trigger manual dari tab Actions (berguna untuk menjalankan ulang scan)

# Prinsip least privilege: secara default workflow hanya boleh membaca isi repo.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # JOB 1 - BUILD: install dependency + unit test + coverage
  # ---------------------------------------------------------------
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (dengan coverage)
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7

  # ---------------------------------------------------------------
  # JOB 2 - SAST SCAN: CodeQL (bawaan GitHub, gratis untuk repo public)
  # ---------------------------------------------------------------
  sast-scan:
    name: SAST Scan (CodeQL)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write # izin upload hasil ke tab Security > Code scanning
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  # ---------------------------------------------------------------
  # JOB 3 - SonarQube + Quality Gate
  # SonarQube Community Build hanya menganalisis satu branch (main),
  # jadi job ini tidak dijalankan untuk event pull_request.
  # ---------------------------------------------------------------
  sonarqube-scan:
    name: SAST + Quality Gate (SonarQube)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # riwayat git lengkap dibutuhkan SonarQube (blame & new code)

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
