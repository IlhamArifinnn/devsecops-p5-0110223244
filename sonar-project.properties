# Konfigurasi analisis SonarQube untuk project Node.js
sonar.projectKey=devsecops-p5-0110223244
sonar.projectName=TaskFlow API (devsecops-p5-0110223244)
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js
sonar.sourceEncoding=UTF-8

# Laporan coverage dari Jest (dibuat oleh job build, lalu diunduh oleh job sonarqube-scan)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/server.js

sonar.exclusions=node_modules/**,coverage/**,exports/**
